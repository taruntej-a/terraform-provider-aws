name: Changelog automation

on:
  pull_request_target:
    types:
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

jobs:
  add-changelog:
    name: Add Changelog Entry
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Copilot to add changelog
        env:
          GH_TOKEN: ${{ secrets.TT_PAT_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          gh pr comment "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --body "@copilot Add a changelog entry for this PR using the changelog skill. This is running in automation — skip the push confirmation and push directly after committing."